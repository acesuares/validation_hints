# CI for Forgejo Actions (runner on dev02; same pattern as inline_forms).
#
# No Node: the job runs in the official ruby image and uses only shell steps.
# actions/checkout and actions/cache are JavaScript and need node inside the
# container, so the checkout is plain git and the gems are installed fresh each
# run.
#
# No GitHub workflows exist — pushing to GitHub triggers nothing.
name: CI

# Push triggers on EVERY branch (inline_forms stuff/prompt/workflow.md:
# "every commit runs through CI") — feature branches were silently skipping
# CI when this was `branches: [master]`.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: docker.io/library/ruby:4.0.10
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git init -q .
          git -c http.extraHeader="Authorization: basic $auth" fetch -q --depth 1 "$SERVER/$REPO.git" "$SHA"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Install gems
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4

      - name: Tests
        run: bundle exec rake test

      - name: RuboCop
        run: bundle exec rubocop

      - name: bundler-audit
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update
