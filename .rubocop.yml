# RuboCop with the Rails "omakase" preset (same recipe as Papiamentu and
# inline_forms). Pre-existing violations are grandfathered in
# .rubocop_todo.yml; fix them incrementally and delete entries as files get
# cleaned. Run with: bundle exec rubocop
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.3
  Exclude:
    - "pkg/**/*"
    - "vendor/**/*"
    - "stuff/**/*"
